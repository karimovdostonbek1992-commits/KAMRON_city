<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMRON - Premium Restoran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .tab-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4f46e5;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 overflow-x-hidden">
    <div id="app">
        <!-- Header -->
        <header class="bg-white/70 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 lg:px-10 h-20 flex justify-between items-center">
                <div class="flex items-center gap-3 group cursor-pointer" onclick="app.setView('customer')">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl group-hover:rotate-12 transition-transform duration-500">K</div>
                    <span class="text-xl font-extrabold tracking-tighter text-slate-900">KAMRON</span>
                </div>
                
                <nav class="flex items-center gap-2">
                    <button id="nav-customer" onclick="app.setView('customer')" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-indigo-50 text-indigo-700">Mijoz</button>
                    <button id="nav-secret" onclick="app.setView('secret')" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all text-slate-500 hover:text-slate-800">Panel</button>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-grow max-w-7xl mx-auto w-full p-6 lg:p-10">
            <!-- Content will be injected here -->
        </main>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.sh/@google/genai@^1.40.0";

        // Constants & Initial Data
        const SECRET_AREA_CODE = "mx097aixom";
        const ADMIN_CODE = "11wer9hk";
        const MANAGER_CODE = "189sidnetbosss";
        const COURIER_CODE = "buysel78ui";

        const CATEGORIES = ['Asosiy Taomlar', 'Ichimliklar', 'Shirinliklar', 'Salatlar'];
        
        const INITIAL_PRODUCTS = [
            { id: '1', name: 'Palov (Osh)', price: 45000, category: 'Asosiy Taomlar', image: 'https://picsum.photos/seed/osh/400/300', status: 'Bor' },
            { id: '2', name: 'Shashlik (Mol go\'shti)', price: 15000, category: 'Asosiy Taomlar', image: 'https://picsum.photos/seed/shashlik/400/300', status: 'Bor' },
            { id: '3', name: 'Somsa', price: 8000, category: 'Asosiy Taomlar', image: 'https://picsum.photos/seed/somsa/400/300', status: 'Tugagan' },
            { id: '4', name: 'Achchiq-chuchuq', price: 12000, category: 'Salatlar', image: 'https://picsum.photos/seed/salad/400/300', status: 'Bor' },
            { id: '5', name: 'Koka-Kola 1.5L', price: 14000, category: 'Ichimliklar', image: 'https://picsum.photos/seed/cola/400/300', status: 'Bor' },
            { id: '6', name: 'Choy (Ko\'k/Qora)', price: 5000, category: 'Ichimliklar', image: 'https://picsum.photos/seed/tea/400/300', status: 'Bor' },
        ];

        const INITIAL_TABLES = [
            { id: 't1', name: 'VIP Xona 1', capacity: 8, price: 100000, image: 'https://picsum.photos/seed/vip1/400/300', isAvailable: true },
            { id: 't2', name: 'VIP Xona 2', capacity: 12, price: 150000, image: 'https://picsum.photos/seed/vip2/400/300', isAvailable: true },
            { id: 't3', name: 'Oila xonasi', capacity: 6, price: 50000, image: 'https://picsum.photos/seed/family/400/300', isAvailable: true },
            { id: 't4', name: 'Ochiq stol #5', capacity: 4, price: 0, image: 'https://picsum.photos/seed/table5/400/300', isAvailable: true },
        ];

        const MOCK_SALES = [
            { date: '13-May', amount: 2500000, orders: 45 },
            { date: '14-May', amount: 1800000, orders: 32 },
            { date: '15-May', amount: 3200000, orders: 58 },
            { date: '16-May', amount: 2100000, orders: 38 },
            { date: '17-May', amount: 4500000, orders: 82 },
            { date: '18-May', amount: 5200000, orders: 95 },
            { date: '19-May', amount: 4800000, orders: 88 },
        ];

        // App State
        window.app = {
            view: 'customer',
            custTab: 'menu',
            secretRole: null,
            pendingRole: null,
            isSecretAreaUnlocked: false,
            adminSection: 'inventory',
            
            products: JSON.parse(localStorage.getItem('products')) || INITIAL_PRODUCTS,
            tables: JSON.parse(localStorage.getItem('tables')) || INITIAL_TABLES,
            orders: JSON.parse(localStorage.getItem('orders')) || [],
            cart: [],
            
            selectedTable: null,
            customerName: '',
            phone: '',
            address: '',
            
            aiReport: null,
            loadingAi: false,

            // State Management
            save() {
                localStorage.setItem('products', JSON.stringify(this.products));
                localStorage.setItem('tables', JSON.stringify(this.tables));
                localStorage.setItem('orders', JSON.stringify(this.orders));
            },

            setView(v) {
                this.view = v;
                this.render();
            },

            setCustTab(t) {
                this.custTab = t;
                this.render();
            },

            setAdminSection(s) {
                this.adminSection = s;
                this.render();
            },

            // Actions
            addToCart(productId) {
                const product = this.products.find(p => p.id === productId);
                if (!product || product.status === 'Tugagan') return;
                
                const existing = this.cart.find(item => item.productId === productId);
                if (existing) {
                    existing.quantity++;
                } else {
                    this.cart.push({ productId: product.id, name: product.name, price: product.price, quantity: 1 });
                }
                this.render();
            },

            removeFromCart(productId) {
                this.cart = this.cart.filter(item => item.productId !== productId);
                this.render();
            },

            placeOrder(type) {
                if (!this.customerName || !this.phone || (type === 'delivery' && !this.address)) {
                    alert("Ma'lumotlarni to'liq to'ldiring");
                    return;
                }
                if (this.cart.length === 0 && type === 'delivery') {
                    alert("Savat bo'sh");
                    return;
                }

                const total = this.cart.reduce((acc, item) => acc + (item.price * item.quantity), 0) + (this.selectedTable?.price || 0);
                
                const newOrder = {
                    id: Math.random().toString(36).substr(2, 6).toUpperCase(),
                    type,
                    items: [...this.cart],
                    total,
                    status: 'Kutilmoqda',
                    customerName: this.customerName,
                    phone: this.phone,
                    address: this.address,
                    tableId: this.selectedTable?.id,
                    createdAt: new Date().toISOString(),
                };

                this.orders.unshift(newOrder);
                this.cart = [];
                this.selectedTable = null;
                this.customerName = '';
                this.phone = '';
                this.address = '';
                this.custTab = 'status';
                this.save();
                this.render();
            },

            updateOrderStatus(id, newStatus) {
                const order = this.orders.find(o => o.id === id);
                if (order) {
                    order.status = newStatus;
                    this.save();
                    this.render();
                }
            },

            toggleStock(id) {
                const product = this.products.find(p => p.id === id);
                if (product) {
                    product.status = product.status === 'Bor' ? 'Tugagan' : 'Bor';
                    this.save();
                    this.render();
                }
            },

            updatePrice(id, newPrice) {
                const product = this.products.find(p => p.id === id);
                if (product) {
                    product.price = Number(newPrice);
                    this.save();
                    this.render();
                }
            },

            deleteProduct(id) {
                if (confirm('Ochirish?')) {
                    this.products = this.products.filter(p => p.id !== id);
                    this.save();
                    this.render();
                }
            },

            addProduct(p) {
                this.products.unshift({ ...p, id: Math.random().toString(36).substr(2, 6) });
                this.save();
                this.render();
            },

            deleteRoom(id) {
                if (confirm('Xonani ochirish?')) {
                    this.tables = this.tables.filter(t => t.id !== id);
                    this.save();
                    this.render();
                }
            },

            addRoom(r) {
                this.tables.unshift({ ...r, id: Math.random().toString(36).substr(2, 6) });
                this.save();
                this.render();
            },

            updateRoomPrice(id, price) {
                const room = this.tables.find(t => t.id === id);
                if (room) {
                    room.price = Number(price);
                    this.save();
                    this.render();
                }
            },

            async generateAIReport() {
                this.loadingAi = true;
                this.render();
                
                try {
                    const apiKey = process.env.GEMINI_API_KEY;
                    const ai = new GoogleGenAI({ apiKey });
                    const prompt = `Quyidagi oxirgi haftalik sotuv ma'lumotlarini tahlil qil va o'zbek tilida qisqa hisobot tayyorla: ${JSON.stringify(MOCK_SALES)}. Hisobotda quyidagilar bo'lsin: 1. Haftaning eng ko'p buyurtma bo'lgan kunlari (Peak days). 2. Sotuvlar past bo'lgan kunlar va ularning sababi haqida taxminlar. 3. Kelasi hafta uchun biznes maslahatlar. Hisobot professional, lekin tushunarli tilda bo'lsin.`;
                    
                    const response = await ai.models.generateContent({
                        model: 'gemini-3-flash-preview',
                        contents: prompt,
                    });
                    this.aiReport = response.text;
                } catch (e) {
                    console.error(e);
                    this.aiReport = "Xatolik yuz berdi. Iltimos qaytadan urinib ko'ring.";
                }
                
                this.loadingAi = false;
                this.render();
            },

            // Rendering Logic
            render() {
                const main = document.getElementById('main-content');
                const navCustomer = document.getElementById('nav-customer');
                const navSecret = document.getElementById('nav-secret');

                // Update Nav
                navCustomer.className = `px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${this.view === 'customer' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:text-slate-800'}`;
                navSecret.className = `px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${this.view === 'secret' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`;

                if (this.view === 'customer') {
                    main.innerHTML = this.renderCustomer();
                } else {
                    main.innerHTML = this.renderSecret();
                }
            },

            renderCustomer() {
                return `
                    <div class="space-y-12 fade-up">
                        <div class="flex bg-white/50 p-1 rounded-2xl border border-slate-100 max-w-md mx-auto">
                            <button onclick="app.setCustTab('menu')" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all ${this.custTab === 'menu' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-400'}">Yetkazish</button>
                            <button onclick="app.setCustTab('reservation')" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all ${this.custTab === 'reservation' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-400'}">Xona Band Qilish</button>
                            <button onclick="app.setCustTab('status')" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all ${this.custTab === 'status' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-400'}">Mening Buyurtmalarim</button>
                        </div>

                        ${this.custTab === 'menu' ? this.renderMenu() : ''}
                        ${this.custTab === 'reservation' ? this.renderReservation() : ''}
                        ${this.custTab === 'status' ? this.renderStatus() : ''}
                    </div>
                `;
            },

            renderMenu() {
                const cartTotal = this.cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
                return `
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-12">
                        <div class="lg:col-span-3 space-y-12">
                            ${CATEGORIES.map(cat => `
                                <section>
                                    <h2 class="text-2xl font-extrabold text-slate-900 mb-8 tracking-tight flex items-center gap-3">
                                        <span class="w-1.5 h-8 bg-indigo-600 rounded-full"></span>
                                        ${cat}
                                    </h2>
                                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
                                        ${this.products.filter(p => p.category === cat).map(p => `
                                            <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden group hover:shadow-2xl hover:shadow-indigo-100 transition-all duration-500">
                                                <div class="relative h-56 overflow-hidden">
                                                    <img src="${p.image}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />
                                                    ${p.status === 'Tugagan' ? '<div class="absolute inset-0 bg-white/80 backdrop-blur-[2px] flex items-center justify-center"><span class="px-4 py-2 bg-red-50 text-red-500 text-[10px] font-bold uppercase tracking-widest rounded-full">Tugagan</span></div>' : ''}
                                                </div>
                                                <div class="p-8">
                                                    <h4 class="font-bold text-slate-900 mb-2 text-lg">${p.name}</h4>
                                                    <div class="flex justify-between items-center mt-6">
                                                        <span class="text-indigo-600 font-extrabold text-lg">${p.price.toLocaleString()}</span>
                                                        <button onclick="app.addToCart('${p.id}')" ${p.status === 'Tugagan' ? 'disabled' : ''} class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center active:scale-90 transition-all disabled:opacity-20">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </section>
                            `).join('')}
                        </div>

                        <aside class="space-y-8">
                            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 sticky top-32">
                                <h3 class="text-xl font-bold mb-8 text-slate-900">Savat</h3>
                                ${this.cart.length === 0 ? `
                                    <div class="py-12 text-center">
                                        <p class="text-slate-300 text-sm font-medium italic">Savat bo'sh</p>
                                    </div>
                                ` : `
                                    <div class="space-y-6 mb-8 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                                        ${this.cart.map(item => `
                                            <div class="flex justify-between items-center group">
                                                <div>
                                                    <p class="font-bold text-slate-800 text-sm">${item.name}</p>
                                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${item.quantity} x ${item.price.toLocaleString()}</p>
                                                </div>
                                                <button onclick="app.removeFromCart('${item.productId}')" class="text-slate-300 hover:text-red-500 transition-colors">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="pt-6 border-t border-slate-50 space-y-6">
                                        <div class="flex justify-between items-center">
                                            <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Jami</span>
                                            <span class="text-xl font-extrabold text-indigo-600">${cartTotal.toLocaleString()}</span>
                                        </div>
                                        <div class="space-y-3">
                                            <input placeholder="Ismingiz" class="w-full px-5 py-3.5 bg-slate-50 rounded-2xl text-sm outline-none focus:bg-white focus:ring-1 focus:ring-indigo-100 transition-all" onchange="app.customerName = this.value" value="${this.customerName}" />
                                            <input placeholder="Telefon" class="w-full px-5 py-3.5 bg-slate-50 rounded-2xl text-sm outline-none focus:bg-white focus:ring-1 focus:ring-indigo-100 transition-all" onchange="app.phone = this.value" value="${this.phone}" />
                                            <textarea placeholder="Manzil" class="w-full px-5 py-3.5 bg-slate-50 rounded-2xl text-sm outline-none focus:bg-white focus:ring-1 focus:ring-indigo-100 transition-all h-24 resize-none" onchange="app.address = this.value">${this.address}</textarea>
                                            <button onclick="app.placeOrder('delivery')" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-slate-200">Buyurtma Berish</button>
                                        </div>
                                    </div>
                                `}
                            </div>
                        </aside>
                    </div>
                `;
            },

            renderReservation() {
                return `
                    <div class="space-y-12">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${this.tables.map(table => `
                                <div onclick="app.selectedTable = ${JSON.stringify(table).replace(/"/g, '&quot;')}; app.render();" class="bg-white rounded-[2.5rem] border ${this.selectedTable?.id === table.id ? 'border-indigo-500 ring-4 ring-indigo-50' : 'border-slate-100'} overflow-hidden cursor-pointer group hover:shadow-xl transition-all duration-500">
                                    <div class="relative h-48 overflow-hidden">
                                        <img src="${table.image}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                                        <div class="absolute top-4 right-4 px-3 py-1 bg-white/90 backdrop-blur-md rounded-full text-[10px] font-bold uppercase tracking-widest text-slate-600">${table.capacity} kishi</div>
                                    </div>
                                    <div class="p-8">
                                        <h4 class="font-bold text-slate-900 mb-2">${table.name}</h4>
                                        <p class="text-indigo-600 font-extrabold">${table.price > 0 ? table.price.toLocaleString() + ' so\'m' : 'Bepul'}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        ${this.selectedTable ? `
                            <div class="max-w-xl mx-auto bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm fade-up">
                                <h3 class="text-xl font-bold mb-8 text-center text-slate-900">Band qilish: ${this.selectedTable.name}</h3>
                                <div class="space-y-4">
                                    <input placeholder="Ismingiz" class="w-full px-6 py-4 bg-slate-50 rounded-2xl text-sm outline-none focus:bg-white focus:ring-1 focus:ring-indigo-100 transition-all" onchange="app.customerName = this.value" value="${this.customerName}" />
                                    <input placeholder="Telefon" class="w-full px-6 py-4 bg-slate-50 rounded-2xl text-sm outline-none focus:bg-white focus:ring-1 focus:ring-indigo-100 transition-all" onchange="app.phone = this.value" value="${this.phone}" />
                                    <button onclick="app.placeOrder('reservation')" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-indigo-100">Band Qilishni Tasdiqlash</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            renderStatus() {
                const userOrders = this.orders.filter(o => o.phone === this.phone || !this.phone);
                return `
                    <div class="max-w-3xl mx-auto space-y-8">
                        ${userOrders.length === 0 ? `
                            <div class="py-32 text-center bg-white rounded-[3rem] border border-slate-50">
                                <p class="text-slate-300 font-medium italic">Buyurtmalar topilmadi</p>
                            </div>
                        ` : userOrders.map(order => this.renderOrderTracker(order)).join('')}
                    </div>
                `;
            },

            renderOrderTracker(order) {
                const steps = [
                    { label: 'Kutilmoqda', status: 'Kutilmoqda' },
                    { label: 'Tayyor', status: 'Buyurtma qabul qilindi, tayyorlanmoqda' },
                    { label: 'Yo\'lda', status: 'Buyurtma yo\'lda, yetkazib berilmoqda' },
                    { label: 'Yakunlandi', status: 'Yakunlandi' },
                ];
                const currentIdx = steps.findIndex(s => s.status === order.status);

                return `
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 animate-in fade-in duration-500 mb-8">
                        <div class="flex justify-between items-start mb-10">
                            <div>
                                <h3 class="text-lg font-bold text-slate-900 tracking-tight">#${order.id}</h3>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${order.type === 'delivery' ? 'Yetkazib berish' : 'Xona bandi'}</p>
                            </div>
                            <div class="text-right"><p class="text-2xl font-bold text-indigo-600">${order.total.toLocaleString()}</p></div>
                        </div>

                        <div class="relative flex justify-between items-center mb-10">
                            <div class="absolute h-[1px] bg-slate-50 w-full top-1/2 -translate-y-1/2 -z-0"></div>
                            <div class="absolute h-[2px] bg-indigo-500 top-1/2 -translate-y-1/2 -z-0 transition-all duration-1000" style="width: ${(currentIdx / (steps.length - 1)) * 100}%"></div>
                            
                            ${steps.map((step, idx) => `
                                <div class="flex flex-col items-center z-10">
                                    <div class="w-3 h-3 rounded-full border-2 transition-all duration-700 ${idx <= currentIdx ? 'bg-indigo-600 border-indigo-600 scale-125' : 'bg-white border-slate-100'}"></div>
                                    <span class="text-[8px] mt-3 font-bold uppercase tracking-tighter ${idx <= currentIdx ? 'text-indigo-600' : 'text-slate-300'}">${step.label}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="bg-slate-50 p-6 rounded-2xl mb-6">
                            <p class="text-xs font-bold text-center text-slate-600">${order.status}</p>
                        </div>

                        <div class="space-y-2">
                            ${order.items.map(item => `
                                <div class="flex justify-between text-[11px] font-medium text-slate-400">
                                    <span>${item.name} x${item.quantity}</span>
                                    <span>${(item.price * item.quantity).toLocaleString()}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            renderSecret() {
                if (!this.isSecretAreaUnlocked) {
                    return this.renderAuthBox("Maxfiy Hudud", "Kodni kiriting", () => {
                        const input = document.getElementById('auth-input').value;
                        if (input === SECRET_AREA_CODE) {
                            this.isSecretAreaUnlocked = true;
                            this.render();
                        } else {
                            alert('Kod noto\'g\'ri');
                        }
                    });
                }

                if (!this.secretRole) {
                    return `
                        <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 fade-up">
                            ${[
                                { id: 'manager', name: 'Boshliq', icon: '📊', color: 'bg-indigo-600' },
                                { id: 'admin', name: 'Admin', icon: '⚙️', color: 'bg-slate-900' },
                                { id: 'courier', name: 'Kuryer', icon: '🛵', color: 'bg-emerald-600' }
                            ].map(role => `
                                <button onclick="app.pendingRole = '${role.id}'; app.render();" class="bg-white p-12 rounded-[3rem] border border-slate-100 hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 group">
                                    <div class="w-20 h-20 ${role.color} rounded-3xl flex items-center justify-center text-4xl mb-8 mx-auto group-hover:rotate-12 transition-transform">${role.icon}</div>
                                    <h3 class="text-xl font-bold text-slate-900">${role.name}</h3>
                                </button>
                            `).join('')}
                        </div>
                        ${this.pendingRole ? `
                            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                                ${this.renderAuthBox(`${this.pendingRole.toUpperCase()} Kirish`, "Ruxsat kodi", () => {
                                    const input = document.getElementById('auth-input').value;
                                    const codes = { manager: MANAGER_CODE, admin: ADMIN_CODE, courier: COURIER_CODE };
                                    if (input === codes[this.pendingRole]) {
                                        this.secretRole = this.pendingRole;
                                        this.pendingRole = null;
                                        this.render();
                                    } else {
                                        alert('Ruxsat kodi noto\'g\'ri');
                                    }
                                }, () => { this.pendingRole = null; this.render(); })}
                            </div>
                        ` : ''}
                    `;
                }

                return `
                    <div class="space-y-10 fade-up">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">${this.secretRole.toUpperCase()} PANELI</h2>
                            <button onclick="app.secretRole = null; app.render();" class="text-slate-400 text-xs font-bold hover:text-slate-900 transition-colors">Chiqish</button>
                        </div>

                        ${this.secretRole === 'manager' ? this.renderManager() : ''}
                        ${this.secretRole === 'admin' ? this.renderAdmin() : ''}
                        ${this.secretRole === 'courier' ? this.renderCourier() : ''}
                    </div>
                `;
            },

            renderAuthBox(title, placeholder, onAuth, onBack) {
                return `
                    <div class="flex flex-col items-center justify-center py-20 bg-white rounded-[2.5rem] border border-slate-100 max-w-sm mx-auto shadow-sm animate-in fade-in duration-500 w-full">
                        <h3 class="text-xl font-bold mb-6 text-slate-800 tracking-tight">${title}</h3>
                        <div class="w-full px-8 space-y-4">
                            <input id="auth-input" type="password" placeholder="${placeholder}" class="w-full px-5 py-3.5 bg-slate-50 border-transparent rounded-2xl outline-none focus:bg-white focus:ring-1 focus:ring-indigo-200 text-center tracking-widest font-medium transition-all" />
                            <button onclick="(${onAuth})()" class="w-full py-3.5 bg-slate-900 text-white rounded-2xl font-bold active:scale-95 transition-all">Kirish</button>
                            ${onBack ? `<button onclick="(${onBack})()" class="w-full text-slate-400 text-xs font-semibold hover:text-slate-600 transition-colors">Orqaga</button>` : ''}
                        </div>
                    </div>
                `;
            },

            renderManager() {
                const totalAmount = MOCK_SALES.reduce((acc, s) => acc + s.amount, 0);
                const totalOrders = MOCK_SALES.reduce((acc, s) => acc + s.orders, 0);
                
                return `
                    <div class="space-y-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="bg-white p-10 rounded-[3rem] border border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Haftalik Daromad</p>
                                <h3 class="text-4xl font-black text-slate-900">${totalAmount.toLocaleString()} <span class="text-sm font-bold text-slate-300">UZS</span></h3>
                            </div>
                            <div class="bg-white p-10 rounded-[3rem] border border-slate-100">
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Jami Buyurtmalar</p>
                                <h3 class="text-4xl font-black text-slate-900">${totalOrders} <span class="text-sm font-bold text-slate-300">TA</span></h3>
                            </div>
                        </div>

                        <div class="bg-white p-10 rounded-[3rem] border border-slate-100">
                            <h4 class="font-bold text-slate-900 mb-8">Sotuvlar Grafigi</h4>
                            <div class="h-64 flex items-end gap-4 px-4">
                                ${MOCK_SALES.map(sale => `
                                    <div class="flex-1 flex flex-col items-center gap-4 group">
                                        <div class="w-full bg-indigo-50 rounded-t-xl relative transition-all duration-500 group-hover:bg-indigo-100" style="height: ${(sale.amount / 6000000) * 100}%">
                                            <div class="absolute -top-8 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-bold text-indigo-600">${(sale.amount/1000000).toFixed(1)}M</div>
                                        </div>
                                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${sale.date}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-slate-900 p-12 rounded-[3.5rem] text-white space-y-8">
                            <div class="flex justify-between items-center">
                                <h4 class="text-xl font-bold">AI Biznes Tahlil</h4>
                                <button onclick="app.generateAIReport()" class="px-6 py-2.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                                    ${this.loadingAi ? '<div class="loader"></div>' : 'Hisobot Tayyorlash'}
                                </button>
                            </div>
                            ${this.aiReport ? `<div class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">${this.aiReport}</div>` : '<p class="text-slate-500 text-sm italic">Haftalik ma\'lumotlar asosida AI tahlilini olish uchun tugmani bosing.</p>'}
                        </div>
                    </div>
                `;
            },

            renderAdmin() {
                return `
                    <div class="space-y-10">
                        <div class="flex bg-white/50 p-1 rounded-2xl border border-slate-100 max-w-xs">
                            <button onclick="app.setAdminSection('inventory')" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all ${this.adminSection === 'inventory' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-400'}">Taomlar</button>
                            <button onclick="app.setAdminSection('rooms')" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all ${this.adminSection === 'rooms' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-400'}">Xonalar</button>
                        </div>

                        ${this.adminSection === 'inventory' ? this.renderInventoryManager() : this.renderRoomManager()}
                    </div>
                `;
            },

            renderInventoryManager() {
                return `
                    <div class="space-y-8">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold text-slate-900">Ombor</h2>
                            <button onclick="app.showAddProduct = !app.showAddProduct; app.render();" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold">+ Yangi Taom</button>
                        </div>

                        ${this.showAddProduct ? `
                            <form onsubmit="event.preventDefault(); app.addProduct({name: this.name.value, price: Number(this.price.value), category: this.category.value, image: 'https://picsum.photos/seed/'+Math.random()+'/400/300', status: 'Bor'}); app.showAddProduct = false; app.render();" class="bg-slate-50 p-8 rounded-3xl space-y-6 max-w-2xl mx-auto border border-slate-100 fade-up">
                                <div class="grid grid-cols-2 gap-4">
                                    <input name="name" required placeholder="Nomi" class="px-5 py-3 rounded-xl bg-white outline-none text-sm" />
                                    <input name="price" type="number" required placeholder="Narxi" class="px-5 py-3 rounded-xl bg-white outline-none text-sm" />
                                    <select name="category" class="col-span-2 px-5 py-3 rounded-xl bg-white outline-none text-sm">
                                        ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
                                    </select>
                                </div>
                                <button type="submit" class="w-full py-3.5 bg-indigo-600 text-white rounded-2xl font-bold">Qo'shish</button>
                            </form>
                        ` : ''}

                        <div class="bg-white rounded-[2rem] border border-slate-50 overflow-hidden">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50/50 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                    <tr>
                                        <th class="px-8 py-5">Taom</th>
                                        <th class="px-8 py-5">Kategoriya</th>
                                        <th class="px-8 py-5">Narxi</th>
                                        <th class="px-8 py-5 text-center">Holati</th>
                                        <th class="px-8 py-5"></th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-50">
                                    ${this.products.map(p => `
                                        <tr class="group hover:bg-slate-50/30 transition-colors">
                                            <td class="px-8 py-6 flex items-center gap-4">
                                                <img src="${p.image}" class="w-12 h-12 rounded-xl object-cover" />
                                                <span class="font-bold text-slate-800 text-sm">${p.name}</span>
                                            </td>
                                            <td class="px-8 py-6"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${p.category}</span></td>
                                            <td class="px-8 py-6">
                                                <input type="number" class="w-24 bg-transparent font-bold text-indigo-600 outline-none" value="${p.price}" onblur="app.updatePrice('${p.id}', this.value)" />
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <button onclick="app.toggleStock('${p.id}')" class="px-4 py-1.5 rounded-full text-[9px] font-bold uppercase transition-all ${p.status === 'Bor' ? 'bg-indigo-50 text-indigo-600' : 'bg-red-50 text-red-400'}">${p.status}</button>
                                            </td>
                                            <td class="px-8 py-6 text-right">
                                                <button onclick="app.deleteProduct('${p.id}')" class="text-slate-200 hover:text-red-500 transition-colors text-xs font-bold opacity-0 group-hover:opacity-100">O'chirish</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderRoomManager() {
                return `
                    <div class="space-y-10">
                        <div class="flex justify-between items-center">
                            <h2 class="text-xl font-bold text-slate-800">Xonalar</h2>
                            <button onclick="app.showAddRoom = !app.showAddRoom; app.render();" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold">+ Yangi Xona</button>
                        </div>

                        ${this.showAddRoom ? `
                            <form onsubmit="event.preventDefault(); app.addRoom({name: this.name.value, capacity: Number(this.capacity.value), price: Number(this.price.value), image: 'https://picsum.photos/seed/'+Math.random()+'/400/300', isAvailable: true}); app.showAddRoom = false; app.render();" class="bg-slate-50 p-10 rounded-[2.5rem] border border-slate-100 max-w-2xl mx-auto space-y-6 fade-up">
                                <div class="grid grid-cols-2 gap-4">
                                    <input name="name" required placeholder="Xona nomi" class="px-5 py-3 rounded-xl bg-white outline-none text-sm font-medium" />
                                    <input name="capacity" type="number" required placeholder="Sig'imi" class="px-5 py-3 rounded-xl bg-white outline-none text-sm font-medium" />
                                    <input name="price" type="number" required placeholder="Narxi" class="px-5 py-3 rounded-xl bg-white outline-none text-sm font-medium col-span-2" />
                                </div>
                                <button type="submit" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold">Qo'shish</button>
                            </form>
                        ` : ''}

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${this.tables.map(room => `
                                <div class="bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden group hover:shadow-xl transition-all duration-500">
                                    <div class="relative h-48 overflow-hidden">
                                        <img src="${room.image}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105" />
                                    </div>
                                    <div class="p-8">
                                        <div class="flex justify-between items-center mb-4">
                                            <h4 class="font-bold text-slate-900">${room.name}</h4>
                                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${room.capacity} kishi</span>
                                        </div>
                                        <div class="mb-6">
                                            <input type="number" class="w-full bg-slate-50 px-4 py-2 rounded-xl font-bold text-indigo-600 text-sm outline-none" value="${room.price}" onblur="app.updateRoomPrice('${room.id}', this.value)" />
                                        </div>
                                        <button onclick="app.deleteRoom('${room.id}')" class="w-full py-3.5 text-slate-300 hover:text-red-500 transition-colors text-xs font-bold uppercase tracking-widest">O'chirish</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            renderCourier() {
                const deliveryOrders = this.orders.filter(o => o.type === 'delivery' && o.status !== 'Yakunlandi');
                return `
                    <div class="space-y-8">
                        <div class="flex items-center gap-3">
                            <h2 class="font-bold text-xl text-slate-800">Kuryer Paneli</h2>
                            <span class="bg-slate-100 text-slate-500 px-2 py-1 rounded text-[10px] font-bold">${deliveryOrders.length} TA</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${deliveryOrders.length === 0 ? `
                                <div class="col-span-2 py-20 bg-white rounded-[3rem] border border-slate-50 text-center">
                                    <p class="text-slate-300 font-medium italic">Faol buyurtmalar yo'q</p>
                                </div>
                            ` : deliveryOrders.map(order => `
                                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 hover:shadow-lg transition-all">
                                    <div class="flex justify-between items-start mb-6">
                                        <div>
                                            <h4 class="font-bold text-slate-900 tracking-tight">Buyurtma #${order.id}</h4>
                                            <p class="text-xs text-slate-400 font-medium">${order.customerName}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-indigo-600 font-bold">${order.total.toLocaleString()}</p>
                                        </div>
                                    </div>

                                    <div class="space-y-3 mb-8 text-sm font-medium text-slate-600">
                                        <p class="flex items-center gap-2">📍 <span class="opacity-80">${order.address}</span></p>
                                        <p class="flex items-center gap-2">📞 <span class="opacity-80">${order.phone}</span></p>
                                    </div>

                                    <div class="flex gap-3">
                                        <button onclick="app.updateOrderStatus('${order.id}', 'Buyurtma yo\'lda, yetkazib berilmoqda')" ${order.status === 'Buyurtma yo\'lda, yetkazib berilmoqda' ? 'disabled' : ''} class="flex-1 py-3 bg-slate-900 text-white rounded-xl text-xs font-bold active:scale-95 transition-all disabled:opacity-20">Yo'lga Chiqdim</button>
                                        <button onclick="app.updateOrderStatus('${order.id}', 'Yakunlandi')" class="flex-1 py-3 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-bold active:scale-95 transition-all">Yakunlandi</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        };

        // Initial Render
        app.render();
    </script>
</body>
</html>
